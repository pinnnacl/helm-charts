apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend-svc
  labels:
    app: {{ .Release.Name }}-frontend-deployment
spec:
  type: LoadBalancer
  selector:
    app: {{ .Release.Name }}-frontend-deployment
  ports:
    - protocol: TCP
      port: 80        
      targetPort: 5000
      nodePort: 31000  
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend-service
  labels:
    app: {{ .Release.Name }}-backend-deployment
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-backend-deployment
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

